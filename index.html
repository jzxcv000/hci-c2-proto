  <title>약속 — 복약 상호작용 프로토타입</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_placeholder">Loading 약속 — 복약 상호작용 프로토타입...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

=\"color: #C7361A\">이지엔6나이트<\u002Fspan>는 야간 통증약이지만, 두 제품 모두 디펜히드라민 성분을 포함하고 있어요.<\u002Fp>\n<p style=\"margin: 0 0 20px\">이미 복용한 약: 전날 오후 11시, 쿨드림 1캡슐<br>이미 복용한 디펜히드라민염산염: 50mg<\u002Fp>\n<p style=\"margin: 0 0 20px\">추가하려는 약: 당일 {{timeLabel}}, 이지엔6나이트 {{caps}}캡슐<br>추가 예정 디펜히드라민염산염: {{plannedMg}}mg<\u002Fp>\n<p style=\"margin: 0 0 20px\">추가 복용 시 24시간 내 복용량 합계: {{totalMg}}mg<\u002Fp>\n<p style=\"margin: 0 0 20px\">예정대로 추가하면 24시간 내 디펜히드라민 복용량 합계가 {{totalMg}}mg으로, 이지엔6나이트 허가사항의 24시간 제한인 75mg{{limitTail}}<\u002Fp>\n<p style=\"margin: 0\">이지엔6나이트 추가 복용을 보류하고 약사에게 현재 약 목록을 보여 주세요.<\u002Fp>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{kidney}}\" hint-placeholder-val=\"{{true}}\">\n<section style=\"position: relative; margin: 34px 2px 0; border-radius: 28px; background: #FDF2C4; border: 1.5px solid #F4D94A; padding: 22px 22px 26px; font-size: 14px; line-height: 20px; font-weight: 700\">\n<button type=\"button\" sc-camel-on-click=\"{{markKidney}}\" aria-label=\"신장 부작용 주의 안내 저장\" aria-pressed=\"{{markKidneyPressed}}\" style=\"position: absolute; right: 8px; top: 8px; width: 44px; height: 44px; border: 0; background: none; padding: 0; display: flex; align-items: center; justify-content: center\">\n<svg aria-hidden=\"true\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"{{markKidneyFill}}\" stroke=\"#111111\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z\"><\u002Fpath><\u002Fsvg>\n<\u002Fbutton>\n<h3 style=\"margin: 0 0 24px; font-size: 15px; font-weight: 700; color: #B03A0B\">신장 부작용 주의<\u002Fh3>\n<p style=\"margin: 0 0 20px\">추가 복용 전 상담이 필요해요.<\u002Fp>\n<p style=\"margin: 0\"><span style=\"color: #B03A0B\">펜타사<\u002Fspan>의 메살라진과 <span style=\"color: #B03A0B\">이지엔6나이트<\u002Fspan>의 이부프로펜을 함께 사용하면 신장 부작용 위험이 증가할 수 있어요.<\u002Fp>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{condWarn}}\" hint-placeholder-val=\"{{true}}\">\n<section style=\"position: relative; margin: on: absolute; inset: 0; background: rgba(0,0,0,0.12); display: flex; align-items: center; justify-content: center\">\n<div role=\"dialog\" aria-label=\"현재 복용하는 약이 있으신가요?\" style=\"width: 300px; margin-top: -18px; border-radius: 28px; background: rgba(255,255,255,0.97); border: 1px solid rgba(0,0,0,0.14); box-shadow: 0 10px 35px rgba(0,0,0,0.18); padding: 17px 14px\">\n<p style=\"margin: 3px 7px 6px; font-size: 16px; font-weight: 700\">현재 복용하는 약이 있으신가요?<\u002Fp>\n<p style=\"margin: 0 7px 16px; font-size: 14px; color: #6B6B6B\">이후에도 추가할 수 있어요.<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<button type=\"button\" class=\"opt\" sc-camel-on-click=\"{{skipMeds}}\" style=\"height: 48px; border: 0; border-radius: 24px; background: #E6E6E6; font-size: 15px; font-weight: 700\">건너뛰기<\u002Fbutton>\n<button type=\"button\" class=\"opt\" sc-camel-on-click=\"{{toCamera}}\" style=\"height: 48px; border: 0; border-radius: 24px; background: #E6E6E6; font-size: 15px; font-weight: 700\">처방전/약봉투 스캔<\u002Fbutton>\n<button type=\"button\" class=\"opt\" sc-camel-on-click=\"{{toSearch}}\" style=\"height: 48px; border: 0; border-radius: 24px; background: #E6E6E6; font-size: 15px; font-weight: 700\">검색하여 추가<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{modalSpecial}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"position: absolute; inset: 0; background: rgba(0,0,0,0.26); display: flex; align-items: center; justify-content: center\">\n<div role=\"dialog\" aria-label=\"특이사항\" style=\"width: 300px; border-radius: 28px; background: rgba(255,255,255,0.97); border: 1px solid rgba(0,0,0,0.14); box-shadow: 0 10px 35px rgba(0,0,0,0.18); padding: 17px 14px 8px\">\n<p style=\"margin: 3px 7px 6px; font-size: 16px; font-weight: 700\">특이사항<\u002Fp>\n<p style=\"margin: 0 7px 16px; font-size: 14px; color: #6B6B6B\">해당하는 항목을 선택해 주세요.<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<sc-for list=\"{{specialOptions}}\" as=\"o\" hint-placeholder-count=\"5\">\n<button type=\"button\" sc-camel-on-click=\"{{o.pick}}\" aria-pressed=\"{{o.pressed}}\" style=\"height: 48px; border: 0; border-radius: 24px; background: {{o.bg}}; font-size: 15px; font-weight: 700\">{{o.label}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{closeModal}}\" style=\"display: block; min-height: 44px; margin: 6px 0 0 auto; border: 0; background: none; padding: 0 10px; font-size: 14px; font-weight: 700; color: #5E5E5E\">닫기<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{modalDisease}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"position: absolute; inset: 0; background: rgba(0,0,0,0.26); display: flex; align-items: center; justify-content: center\">\n<div role=\"dialog\" aria-label=\"기저질환 입력\" style=\"width: 300px; border-radius: 28px; background: rgba(255,255,255,0.97); border: 1px solid rgba(0,0,0,0.14); box-shadow: 0 10px 35px rgba(0,0,0,0.18); padding: 17px 14px 8px\">\n<p style=\"margin: 3px 7px 6px; font-size: 16px; font-weight: 700\">기저질환 입력<\u002Fp>\n<label for=\"f-disease\" style=\"display: block; margin: 0 7px 14px; font-size: 14px; color: #6B6B6B\">질환명을 입력해 주세요.<\u002Flabel>\n<input id=\"f-disease\" type=\"text\" placeholder=\"예: 크론병\" autocomplete=\"off\" value=\"{{diseaseDraft}}\" sc-camel-on-change=\"{{onDisease}}\" sc-camel-on-key-down=\"{{onDiseaseKey}}\" style=\"display: block; width: 100%; height: 48px; border: 1px solid #D7D7D7; border-radius: 12px; background: #F4F4F4; padding: 0 12px; font-size: 15px\">\n<button type=\"button\" sc-camel-on-click=\"{{confirmDisease}}\" style=\"display: block; width: 100%; height: 48px; margin-top: 10px; border: 0; border-radius: 24px; background: #00BFCA; font-size: 15px; font-weight: 700\">확인<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{openSpecial}}\" style=\"display: block; min-height: 44px; margin: 6px 0 0 auto; border: 0; background: none; padding: 0 10px; font-size: 14px; font-weight: 700; color: #5E5E5E\">취소<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{modalCart}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"position: absolute; inset: 0; background: rgba(255,255,255,0.35); display: flex; align-items: center; justify-content: center\">\n<div role=\"dialog\" aria-label=\"카트에 담은 약물\" style=\"width: 311px; border-radius: 28px; background: rgba(246,246,250,0.96); box-shadow: 0 10px 35px rgba(0,0,0,0.16); padding: 22px 16px 10px\">\n<h2 style=\"margin: 0 8px; font-size: 24px; line-height: 30px; font-weight: 800; letter-spacing: -0.6px\">카트에 담은 약물<\u002Fh2>\n<p style=\"margin: 20px 8px 20px; font-size: 13px; line-height: 20px; color: #5E5E5E\">새로 추가하여 기존 약과 상호작용을 알아볼 약 목록을 확인하세요.<\u002Fp>\n<sc-for list=\"{{cartRows}}\" as=\"c\" hint-placeholder-count=\"3\">\n<button type=\"button\" sc-camel-on-click=\"{{c.toggle}}\" aria-pressed=\"{{c.pressed}}\" style=\"display: flex; align-items: center; gap: 16px; width: 100%; height: 57px; border: 0; border-top: 1px solid {{c.rule}}; background: none; padding: 0 14px 0 0; font-size: 17px; text-align: left\">\n<span aria-hidden=\"true\" style=\"flex: none; width: 40px; height: 40px; border-radius: 50%; background: #00BFCA; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #0B3B3F\">A<\u002Fspan>\n<span style=\"flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{c.short}}<\u002Fspan>\n<span style=\"flex: none; width: 18px; height: 18px; border-radius: 3px; border: 1.5px solid #00BFCA; background: {{c.boxBg}}; display: flex; align-items: center; justify-content: center\">\n<svg aria-hidden=\"true\" width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"3.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>\n<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<div style=\"display: flex; justify-content: flex-end; gap: 22px; margin-top: 26px; padding-right: 10px\">\n<button type=\"button\" sc-camel-on-click=\"{{continueSearch}}\" style=\"min-height: 44px; border: 0; background: none; padding: 0 8px; font-size: 15px; color: #5E5E5E\">계속 검색<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{makeReport}}\" style=\"min-height: 44px; border: 0; background: none; padding: 0 8px; font-size: 15px; font-weight: 700; color: #007C85\">리포트 만들기<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{modalChecklist}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"position: absolute; inset: 0; background: rgba(0,0,0,0.22); display: flex; align-items: center; justify-content: center\">\n<div role=\"dialog\" aria-label=\"의료진 체크리스트\" style=\"width: 313px; border-radius: 29px; background: #FFFFFF; border: 1.5px solid #171717; box-shadow: 0 14px 40px rgba(0,0,0,0.2); padding: 20px 16px 10px\">\n<h2 style=\"margin: 2px 8px 20px; font-size: 22px; line-height: 30px; font-weight: 800; letter-spacing: -0.5px\">의료진 체크리스트<\u002Fh2>\n<sc-for list=\"{{checklist}}\" as=\"k\" hint-placeholder-count=\"5\">\n<div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 57px; border-bottom: 1px solid #DDDDDD; padding-left: 5px; font-size: 14px\">\n<span>{{k.label}}<\u002Fspan>\n<button type=\"button\" sc-camel-on-click=\"{{k.toggle}}\" aria-pressed=\"{{k.pressed}}\" aria-label=\"{{k.aria}}\" style=\"flex: none; width: 44px; height: 44px; margin-right: -8px; border: 0; background: none; padding: 0; display: flex; align-items: center; justify-content: center\">\n<span style=\"width: 19px; height: 19px; border-radius: 3px; border: 1.5px solid {{k.border}}; background: {{k.bg}}; display: flex; align-items: center; justify-content: center\">\n<svg aria-hidden=\"true\" width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"3.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>\n<\u002Fspan>\n<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<button type=\"button\" sc-camel-on-click=\"{{closeModal}}\" style=\"display: block; min-height: 44px; margin: 14px 0 0 auto; border: 0; background: none; padding: 0 10px; font-size: 14px; font-weight: 700; color: #5E5E5E\">닫기<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{hasToast}}\" hint-placeholder-val=\"{{false}}\">\n<div role=\"status\" style=\"position: absolute; left: 20px; right: 20px; bottom: 84px; display: flex; justify-content: center; pointer-events: none\">\n<div style=\"max-width: 100%; border-radius: 18px; background: rgba(25,25,25,0.9); color: #FFFFFF; padding: 10px 16px; font-size: 12px; line-height: 18px; text-align: center\">{{toast}}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;timeOfDay&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;자동&quot;,&quot;아침&quot;,&quot;점심&quot;,&quot;저녁&quot;],&quot;default&quot;:&quot;자동&quot;},&quot;$preview&quot;:{&quot;width&quot;:393,&quot;height&quot;:852}}\">\nclass Component extends DCLogic {\n  state = {\n    screen: 'profile',\n    modal: '',\n    name: '', dd: '', mm: '', yyyy: '', gender: '',\n    condType: '', cond: '', condTouched: false, sampleFilled: false, diseaseDraft: '',\n    scan: { pentasa: true, cooldream: true },\n    meds: [],\n    query: '', searching: false, nightSelected: false,\n    idMark: '', idFilter: 'color',\n    cart: [\n      { id: 'night', name: '이지엔6나이트연질캡슐', short: '이지엔6나이트연질캡슐', sub: '이부프로펜, 디펜히드라민염산염', added: true, checked: true, listed: true },\n      { id: 'vita', name: '고려은단비타…', short: '고려은단비타…', sub: '', added: true, checked: false, listed: false },\n      { id: 'tyl', name: '타이레놀이알…', short: '타이레놀이알…', sub: '', added: true, checked: false, listed: false }\n    ],\n    dose: '2', time: '22: '].map((o) => {\n        const on = o === '없음' ? (s.condTouched && !s.cond) : s.condType === o;\n        return {\n          label: o, pressed: on ? 'true' : 'false', bg: on ? TEAL : '#E6E6E6',\n          pick: () => {\n            if (o === '기저질환') { this.setState({ modal: 'disease', diseaseDraft: disease }); return; }\n            if (o === '없음') { setCond('', ''); return; }\n            setCond(o, o);\n          }\n        };\n      }),\n      diseaseDraft: s.diseaseDraft,\n      onDisease: (e) => this.setState({ diseaseDraft: e.target.value }),\n      onDiseaseKey: (e) => { if (e.key === 'Enter') confirmDisease(); },\n      confirmDisease: confirmDisease,\n      saveProfile: saveProfile,\n      skipMeds: () => this.go('home'),\n\n      toCamera: () => this.go('camera', { scan: { pentasa: true, cooldream: true } }),\n      cameraBack: () => this.go(s.meds.length || s.reports.length ? 'home' : 'profile', { modal: s.meds.length || s.reports.length ? '' : 'meds' }),\n      shoot: shoot,\n      finishScan: () => this.go('scan'),\n      retake: () => this.go('camera'),\n      scanRows: scanRows,\n      completeScan: completeScan,\n\n      givenName: givenName,\n      faceHappy: allTaken, faceWaiting: !allTaken,\n      bubbleText: allTaken ? givenName + '님, 오늘 약을 모두 챙겼어요!' : givenName + '님, 오늘 복용약을 확인해 주세요.',\n      homeBg: SLOT_BG[slot], slotLabel: slot,\n      homeMeds: homeMeds, noMeds: !s.meds.length,\n      histAOpen: s.histA, histBOpen: s.histB,\n      histARot: s.histA ? '180deg' : '0deg', histBRot: s.histB ? '180deg' : '0deg',\n      toggleHistA: () => this.setState({ histA: !s.histA }),\n      toggleHistB: () => this.setState({ histB: !s.histB }),\n\n      toSearch: () => this.go('search', { query: '', searching: false }),\n      searchBack: () => this.go('home'),\n      query: s.query,\n      searching: s.searching, notSearching: !s.searching,\n      onQuery: (e) => this.setState({ query: e.target.value, searching: true }),\n      onQueryKey: (e) => { if (e.key === 'Enter') submitQuery(); },\n      startSearching: () => this.setState({ searching: true }),\n      leadAction: () => this.setState(s.searching ? { searching: false, query: '' } : { searching: true }),\n      leadLabel: s.searching ? '검색 취소' : '검색 시작',\n      trailAction: () => { if (s.searching) this.setState({ query: '' }); else this.say('음성 검색은 아직 준비 중이에요.'); },\n      trailLabel: s.searching ? '검색어 지우기' : '음성으로 검색',\n      showWhenSearching: s.searching ? 'block' : 'none',\n      showWhenIdle: s.searching ? 'none' : 'block',\n      suggestions: suggestions, noSuggestions: !suggestions.length,\n      symptoms: symptoms,\n      idMark: s.idMark, onIdMark: (e) => this.setState({ idMark: e.target.value }),\n      idFilters: idFilters,\n      idSearch: () => this.say('식별 검색은 아직 준비 중이에요.'),\n\n      hasResults: matches, noResults: !matches,\n      resultsBack: () => this.go('search', { searching: true }),\n      editQuery: () => this.go('search', { searching: true }),\n      nightBg: s.nightSelected ? TEAL : '#F5F5F5',\n      nightPressed: s.nightSelected ? 'true' : 'false',\n      pickNight: () => {\n        this.setState({ nightSelected: true });\n        clearTimeout(this._navTimer);\n        this._navTimer = setTimeout(() => { if (this.state.screen === 'results') this.go('detail'); }, 260);\n      },\n      otherProduct: () => this.say('이 프로토타입에서는 이지엔6나이트만 살펴볼 수 있어요.'),\n\n      detailBack: () => this.go('results'),\n      addToCart: () => this.setState({ modal: 'cart', cart: s.cart.map((c) => (c.id === 'night' ? Object.assign({}, c, { added: true, checked: true }) : c)) }),\n      cartRows: cartRows,\n      continueSearch: () => this.go('search', { query: '', searching: false }),\n      makeReport: makeReport,\n\n      builderCart: builderCart, cartEmpty: !listed.length,\n      builderMeds: builderMeds,\n      dose: s.dose, time: s.time,\n      onDose: (e) => this.setState({ dose: e.target.value }),\n      onTime: (e) => this.setState({ time: e.target.value }),\n      cartPlus: () => this.go('search', { query: '', searching: false }),\n      cartMinus: () => {\n        if (listed.every((c) => c.checked)) { this.say('뺄 약의 체크를 먼저 해제해 주세요.'); return; }\n        this.setState({ cart: s.cart.map((c) => (c.listed && !c.checked ? Object.assign({}, c, { listed: false }) : c)) });\n      },\n      medsPlus: () => this.go('camera', { scan: { pentasa: true, cooldream: true } }),\n      medsMinus: () => {\n        if (s.meds.every((m) => m.on)) { this.say('뺄 약의 체크를 먼저 해제해 주세요.'); return; }\n        this.setState({ meds: s.meds.filter((m) => m.on) });\n      },\n      generate: generate,\n      openReport: () => this.go('history'),\n\n      hasFindings: hasFindings, noFindings: !hasFindings,\n      redCount: dup ? 1 : 0, yellowCount: kidney ? 1 : 0,\n      hasNight: hasNight, mapEmpty: !hasNight && !hasPentasa && !hasCooldream,\n      hasPentasa: hasPentasa, hasCooldream: hasCooldream, showBoth: hasPentasa && hasCooldream,\n      dup: dup, kidney: kidney, condWarn: condWarn, disease: rDisease,\n      timeLabel: timeLabel, caps: caps, plannedMg: plannedMg, totalMg: totalMg,\n      limitTail: totalMg > 75 ? '을 초과해요.' : '에 도달해요.',\n      markDup: mark('dup'), markKidney: mark('kidney'), markCond: mark('cond'),\n      markDupPressed: s.marks.dup ? 'true' : 'false', markKidneyPressed: s.marks.kidney ? 'true' : 'false', markCondPressed: s.marks.cond ? 'true' : 'false',\n      markDupFill: s.marks.dup ? '#111111' : 'none', markKidneyFill: s.marks.kidney ? '#111111' : 'none', markCondFill: s.marks.cond ? '#111111' : 'none',\n      showChatFab: is('report') && !s.chatOpen && !s.modal,\n      showChatTease: !s.chatSeen,\n      chatOpen: is('report') && s.chatOpen,\n      openChat: () => this.setState({ chatOpen: true, chatSeen: true }),\n      closeChat: () => this.setState({ chatOpen: false }),\n      comboLabel: comboLabel,\n      chatMsgs: chatMsgs, chatTyping: s.chatTyping,\n      chatChips: chatChips, chipsTitle: chatChips.length ? '예상 질문' : '예상 질문을 모두 확인했어요',\n      chatDraft: s.chatDraft,\n      onChatDraft: (e) => this.setState({ chatDraft: e.target.value }),\n      onChatKey: (e) => {\n        if (e.key !== 'Enter' || e.isComposing || (e.nativeEvent && e.nativeEvent.isComposing)) return;\n        ask(s.chatDraft);\n      },\n      sendChat: () => ask(s.chatDraft),\n      openChecklist: () => this.setState({ modal: 'checklist' }),\n      closeReport: () => this.go(s.reportFrom === 'history' ? 'history' : 'builder'),\n      checklist: checklist\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
